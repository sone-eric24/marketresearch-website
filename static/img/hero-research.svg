<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
<title id="t">Illustration: market data, a location pin on Cameroon and a magnifying glass over a chart</title>
<!-- Drawn in-house for WS Market Research. Free to use and edit on this site. -->
<defs>
  <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f7"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0d24" flood-opacity=".35"/></filter>
</defs>
<!-- soft background shapes -->
<circle cx="250" cy="200" r="170" fill="#ffffff" opacity=".06"/>
<circle cx="250" cy="200" r="120" fill="#ffffff" opacity=".05"/>
<!-- dotted route -->
<path d="M40 330 C 120 300, 120 220, 200 230 S 330 150, 420 80" fill="none" stroke="#FE7146" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".9"/>
<!-- main dashboard card -->
<g filter="url(#sh)">
  <rect x="110" y="70" width="270" height="200" rx="16" fill="url(#g1)"/>
</g>
<rect x="110" y="70" width="270" height="34" rx="16" fill="#303360"/>
<rect x="110" y="88" width="270" height="16" fill="#303360"/>
<circle cx="132" cy="87" r="5" fill="#FF0000"/><circle cx="148" cy="87" r="5" fill="#FE7146"/><circle cx="164" cy="87" r="5" fill="#2e9b2e"/>
<rect x="132" y="120" width="90" height="9" rx="4.5" fill="#303360" opacity=".85"/>
<rect x="132" y="136" width="60" height="7" rx="3.5" fill="#303360" opacity=".3"/>
<!-- bars -->
<g>
  <rect x="140" y="208" width="26" height="42" rx="5" fill="#006400" opacity=".35"/>
  <rect x="178" y="188" width="26" height="62" rx="5" fill="#006400" opacity=".55"/>
  <rect x="216" y="170" width="26" height="80" rx="5" fill="#006400" opacity=".75"/>
  <rect x="254" y="146" width="26" height="104" rx="5" fill="#006400"/>
</g>
<path d="M134 250h212" stroke="#303360" stroke-opacity=".25" stroke-width="2"/>
<!-- trend line -->
<path d="M153 196 L191 176 L229 160 L267 128 L330 120" fill="none" stroke="#FE7146" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="267" cy="128" r="6" fill="#fff" stroke="#FE7146" stroke-width="4"/>
<!-- donut -->
<circle cx="330" cy="200" r="26" fill="none" stroke="#303360" stroke-opacity=".15" stroke-width="12"/>
<circle cx="330" cy="200" r="26" fill="none" stroke="#FE7146" stroke-width="12" stroke-dasharray="105 200" transform="rotate(-90 330 200)"/>
<!-- people card -->
<g filter="url(#sh)"><rect x="34" y="150" width="120" height="96" rx="14" fill="#fff"/></g>
<circle cx="64" cy="182" r="13" fill="#FE7146"/><circle cx="64" cy="177" r="5.5" fill="#fff"/><path d="M55 191a9 9 0 0 1 18 0" fill="#fff"/>
<rect x="84" y="174" width="54" height="7" rx="3.5" fill="#303360" opacity=".8"/>
<rect x="84" y="186" width="36" height="6" rx="3" fill="#303360" opacity=".3"/>
<circle cx="64" cy="222" r="13" fill="#006400"/><circle cx="64" cy="217" r="5.5" fill="#fff"/><path d="M55 231a9 9 0 0 1 18 0" fill="#fff"/>
<rect x="84" y="214" width="46" height="7" rx="3.5" fill="#303360" opacity=".8"/>
<rect x="84" y="226" width="30" height="6" rx="3" fill="#303360" opacity=".3"/>
<!-- location pin -->
<g filter="url(#sh)">
  <path d="M404 40c-19 0-34 15-34 34 0 26 34 58 34 58s34-32 34-58c0-19-15-34-34-34z" fill="#FE7146"/>
</g>
<circle cx="404" cy="74" r="13" fill="#fff"/>
<circle cx="404" cy="74" r="5" fill="#006400"/>
<!-- magnifying glass -->
<g filter="url(#sh)">
  <circle cx="330" cy="300" r="46" fill="#ffffff" fill-opacity=".92" stroke="#303360" stroke-width="10"/>
  <path d="M363 333l42 42" stroke="#303360" stroke-width="16" stroke-linecap="round"/>
</g>
<path d="M305 312l16-16 12 10 20-24" fill="none" stroke="#006400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- speech bubble -->
<g filter="url(#sh)"><path d="M150 300h110a12 12 0 0 1 12 12v34a12 12 0 0 1-12 12h-74l-20 16v-16h-16a12 12 0 0 1-12-12v-34a12 12 0 0 1 12-12z" fill="#fff"/></g>
<rect x="156" y="316" width="96" height="7" rx="3.5" fill="#303360" opacity=".8"/>
<rect x="156" y="330" width="70" height="7" rx="3.5" fill="#303360" opacity=".35"/>
</svg>
